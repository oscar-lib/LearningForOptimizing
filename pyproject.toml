[project]
name = "learningforoptimizing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "numpy>=2.1.0",
    "python-dotenv>=1.0",
    "torch-geometric>=2.5.3",
    "icecream>=2.1.3",
    "sumtree>=0.2.7",
    "py4j>=0.10.9.7",
    "typed-argparse>=0.3.1",
    "polars>=1.6.0",
    "matplotlib>=3.9.2",
    "altair>=5.4.1",
    "jupyterlab>=4.2.5",
    "orjson>=3.10.18",
    "pandas>=2.3.0",
    "pyarrow>=20.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/python"]

[project.optional-dependencies]
torch = ["torch>=2.6.0"]
torch-cpu = ["torch>=2.6.0"]
torch-cu118 = ["torch>=2.6.0"]
torch-cu124 = ["torch>=2.6.0"]


[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "torch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
conflicts = [
    [
        { extra = "torch-cpu" },
        { extra = "torch-cu124" },
        { extra = "torch-cu118" },
    ],
]
dev-dependencies = ["pytest>=8.3.2"]


[tool.uv.sources]
torch = [
    { index = "torch-cpu", extra = "torch-cpu" },
    { index = "torch-cu118", extra = "torch-cu118" },
    { index = "torch-cu124", extra = "torch-cu124" },
]
